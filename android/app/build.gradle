plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.scanneranimal.app"

    // Mantenemos 34 para compilar y evitar errores de librerías como NFC
    compileSdk = 34 
    ndkVersion = "27.0.12077973"

    compileOptions {
        // Java 17 es obligatorio para Kotlin 2.1.0 y Gradle 8.2+
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Debe coincidir con la versión de Java anterior
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.scanneranimal.app"
        // SDK mínimo para soportar las librerías de IA y Notificaciones
        minSdk = 24

        // Cumplimos con el requisito de Google Play (SDK 35)
        targetSdk = 35 

        versionCode = flutter.versionCode
        versionName = flutter.versionName
        
        // Evita errores de límite de métodos en apps con Firebase
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release 
            // Optimizaciones de tamaño para el APK final
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Firebase BoM para gestionar versiones automáticamente
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    
    // Soporte para multidex
    implementation 'androidx.multidex:multidex:2.0.1' 
    
    // Librería base de Android KTX compatible con el SDK 34/35
    implementation "androidx.core:core-ktx:1.12.0"
}