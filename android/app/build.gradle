plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.scanneranimal.app"
    // Mantener en 34 para evitar los errores de "Sugerencia API 35"
    compileSdk = 35

    compileOptions {
        // Actualizado a 17 para compatibilidad total con Gradle 8+ y Codemagic
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.scanneranimal.app"
        minSdk = 24
        targetSdk = 35
        // Asegúrate de que en el pubspec.yaml el build-number sea 28 o superior
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }
}

dependencies {
    // Actualizado el BOM de Firebase a una versión estable para SDK 34
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
}

configurations.all {
    resolutionStrategy {
        // Bloqueo de versiones que requieren SDK 35+
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.activity:activity:1.9.0'
        force 'androidx.activity:activity-ktx:1.9.0'
        force 'androidx.lifecycle:lifecycle-common:2.8.0'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
        
        // Media3 compatible con SDK 34 para evitar errores de compilación
        force 'androidx.media3:media3-exoplayer:1.3.1'
        force 'androidx.media3:media3-common:1.3.1'
        force 'androidx.media3:media3-extractor:1.3.1'
        force 'androidx.media3:media3-datasource:1.3.1'
        force 'androidx.media3:media3-decoder:1.3.1'
        force 'androidx.media3:media3-database:1.3.1'
        force 'androidx.media3:media3-container:1.3.1'
        force 'androidx.media3:media3-exoplayer-hls:1.3.1'
        force 'androidx.media3:media3-exoplayer-dash:1.3.1'
        force 'androidx.media3:media3-exoplayer-rtsp:1.3.1'
        force 'androidx.media3:media3-exoplayer-smoothstreaming:1.3.1'
    }
}