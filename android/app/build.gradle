plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.scanneranimal.app"
    compileSdk = 34

    // UNIFICACIÓN: Forzamos Java 11 para evitar el error de "Inconsistent JVM-target"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        // Sincronizado con Java 11 para que in_app_review no falle
        jvmTarget = "11"
        freeCompilerArgs += ["-Xskip-prerelease-check", "-nowarn"]
    }

    defaultConfig {
        applicationId = "com.scanneranimal.app"
        minSdk = 24
        targetSdk = 34 
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Usa firma de release si existe el archivo, si no, usa debug para no romper el build
            signingConfig (keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug)
            
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Firebase BoM para asegurar que todas las librerías de Firebase usen versiones compatibles entre sí
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
}