plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.scanneranimal.app"
    // ACTUALIZADO A 35: Para que Google Play no muestre la sugerencia/error
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.scanneranimal.app"
        minSdk = 24
        targetSdk = 35 
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
}

configurations.all {
    resolutionStrategy {
        // ACTUALIZADO: Subimos las versiones mínimas para que coincidan con el SDK 35
        // Esto evita errores de compilación en Codemagic
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
        force 'androidx.activity:activity:1.9.3'
        force 'androidx.activity:activity-ktx:1.9.3'
        force 'androidx.lifecycle:lifecycle-common:2.8.7'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
        force 'androidx.browser:browser:1.8.0'
        
        // Media3 estable para SDK 35
        force 'androidx.media3:media3-exoplayer:1.4.1'
        force 'androidx.media3:media3-common:1.4.1'
    }
}