buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null || namespace.isEmpty()) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifestXml = new XmlParser().parse(manifestFile)
                        def packageName = manifestXml.attribute('package')
                        if (packageName != null) {
                            namespace = packageName
                        }
                    }
                }
                compileSdk = 34
                buildToolsVersion = "34.0.0"
            }
        }

        // --- EL PARCHE DEFINITIVO PARA NFC_MANAGER ---
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
                // Esto le dice a Kotlin: "Ignora que el código sea viejo, compila igual"
                allWarningsAsErrors = false 
                freeCompilerArgs += [
                    "-Xskip-prerelease-check",
                    "-Xsuppress-version-warnings",
                    "-P", "plugin:org.jetbrains.kotlin.android:enabled=false" // Desactiva verificaciones estrictas
                ]
            }
        }
    }
}

// Bloque especial para forzar a nfc_manager a no fallar
subprojects {
    if (project.name == "nfc_manager") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.freeCompilerArgs += ["-nowarn"] 
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}