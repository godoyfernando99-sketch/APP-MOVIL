buildscript {
    ext.kotlin_version = '1.9.24' // Bajamos a 1.9.24 para máxima compatibilidad
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ESTO ES LO QUE ARREGLA EL ERROR DE NFC_MANAGER
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Forzamos a que todas las librerías usen el mismo nivel de SDK
                compileSdk = 34
                buildToolsVersion = "34.0.0"
                
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }
        }
        
        // ESTA ES LA "MORDAZA" PARA EL COMPILADOR
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
                // IMPORTANTE: Le decimos a Kotlin que NO trate los warnings como errores
                allWarningsAsErrors = false
                // Ignoramos warnings específicos de APIs viejas
                freeCompilerArgs += ["-nowarn", "-Xlint:none"]
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}