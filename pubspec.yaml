name: scanneranimal
description: "IA Veterinaria - Diagnóstico, Gestación y Seguimiento"
publish_to: 'none'
version: 1.0.24+28

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_sign_in: 6.2.1
  video_player: 2.8.1
  nfc_manager: 4.1.1
  vibration: 2.0.1
  go_router: 13.1.0
  provider: 6.1.1

  # LA TRINIDAD DE VERSIONES QUE FUNCIONA:
  firebase_core: 3.10.1
  firebase_auth: 5.4.1
  cloud_firestore: 5.5.0
  firebase_vertexai: 1.1.0

  in_app_purchase: 3.2.0
  awesome_notifications: 0.11.0 
  in_app_update: 4.2.1
  in_app_review: 2.0.9
  shared_preferences: 2.2.2
  pdf: 3.10.8
  printing: 5.11.0
  image_picker: 1.0.7
  path_provider: 2.1.2
  share_plus: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.13.1

dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/video/

flutter_launcher_icons:
  android: true 
  ios: true
  image_path: "assets/icons/logo_app.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/logo_app.png"