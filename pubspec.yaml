name: scanneranimal
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Comunicación y Utilidades
  http: ^1.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  share_plus: ^10.1.0

  # Interfaz y Navegación
  cupertino_icons: ^1.0.8
  # Se fijó en 6.1.0 sin el símbolo ^ para evitar el error de compilación de la 6.2.1
  google_fonts: 6.1.0 
  go_router: ^16.2.0
  provider: ^6.1.2
  
  # Cámara y Almacenamiento
  image_picker: ^1.1.2
  # Se actualizó shared_preferences a una versión compatible con el SDK actual
  shared_preferences: ^2.3.2
  
  # Firebase (Base de datos y Auth)
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.1
  
  # Pagos y Suscripciones
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0+5
  in_app_purchase_storekit: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  # Asegúrate de que estas carpetas existan físicamente en tu proyecto
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "logo_app"
  ios: true
  image_path: "assets/icons/logo_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/logo_app.png"
