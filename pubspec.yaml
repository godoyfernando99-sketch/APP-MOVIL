name: scanneranimal
description: "IA Veterinaria - Diagnóstico, Gestación y Seguimiento"
publish_to: 'none'

version: 1.0.24+26 

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- MULTIMEDIA Y VIDEO ---
  video_player: ^2.8.1

  # --- HARDWARE Y SENSORES ---
  nfc_manager: ^3.3.0

  # --- NAVEGACIÓN Y ESTADO ---
  go_router: ^13.1.0
  provider: ^6.1.1

  # --- BACKEND Y CLOUD (Sincronización de Historial) ---
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2

  # --- INTELIGENCIA ARTIFICIAL ---
  firebase_vertexai: ^0.2.1 

  # --- SISTEMA DE PAGOS Y SUSCRIPCIONES ---
  in_app_purchase: ^3.2.0

  # --- NOTIFICACIONES Y RECORDATORIOS ---
  awesome_notifications: ^0.9.3+1 

  # --- CALIFICACIÓN Y MEMORIA ---
  in_app_review: ^2.0.9
  shared_preferences: ^2.2.2

  # --- GENERACIÓN DE PDF Y REPORTES ---
  pdf: ^3.10.8
  printing: ^5.11.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/video/

# CONFIGURACIÓN DE ICONOS DE LANZAMIENTO
flutter_launcher_icons:
  android: true 
  ios: true
  image_path: "assets/icons/logo_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/logo_app.png"