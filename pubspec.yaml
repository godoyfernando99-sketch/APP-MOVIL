name: scanneranimal
description: "Identificación animal mediante IA y Microchip NFC."
publish_to: "none"

version: 1.0.0+22

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- COMUNICACIÓN Y UTILIDADES ---
  http: ^1.2.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  share_plus: ^10.1.0
  in_app_update: ^4.0.2
  video_player: ^2.8.1

  # --- HARDWARE: NFC & SENSORES ---
  nfc_manager: ^4.1.1 

  # --- INTERFAZ Y NAVEGACIÓN ---
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  go_router: ^14.2.0
  provider: ^6.1.2

  # --- CÁMARA Y ALMACENAMIENTO ---
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.2

  # --- FIREBASE & IA (Vertex AI) ---
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  google_sign_in: ^6.2.2
  firebase_vertexai: ^1.1.0

  # --- PAGOS Y SUSCRIPCIONES ---
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.4.0+5
  in_app_purchase_storekit: ^0.4.4

  # --- GENERACIÓN DE PDF Y REPORTES ---
  pdf: ^3.10.8
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/video/

# CORRECCIÓN EN LA GENERACIÓN DE ICONOS
flutter_launcher_icons:
  android: true 
  ios: true
  image_path: "assets/icons/logo_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/logo_app.png"
